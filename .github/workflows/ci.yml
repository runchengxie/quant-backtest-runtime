name: runtime-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked documentation dependencies
        run: uv sync --locked --group docs --python 3.13
      - name: Build documentation and check localized navigation
        run: |
          uv run --locked --group docs mkdocs build --strict
          uv run --locked --group docs python project_tools/check_locale_navigation.py
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python }}
      - name: Lint
        run: uv run --locked ruff check src scripts tests
      - name: Format
        run: uv run --locked ruff format --check src scripts tests
      - name: Type check
        run: uv run --locked ty check src scripts
      - name: Backtest worker and release tests
        run: |
          uv run --locked coverage run -m pytest -q
          uv run --locked coverage combine
          uv run --locked coverage report
      - name: Synthetic CLI workflow
        run: uv run --locked python scripts/smoke_backtest.py
      - name: Dependency audit
        if: matrix.python == '3.13'
        run: uv run --locked pip-audit --local
      - name: Documentation build
        run: uv run --locked --group docs mkdocs build --strict

  rust-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: runchengxie/quant-backtest-engine
          ref: 3ee74bfa21d743e595ce61d0ac06b97dd588ebd6
          path: .engine-source
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .engine-source
      - uses: astral-sh/setup-uv@v6
      - run: cargo build --locked --manifest-path .engine-source/Cargo.toml
      - run: uv sync --locked --group dev --python 3.13
      - name: Real Rust engine job and lifecycle checks
        env:
          BACKTEST_ENGINE_TEST_EXECUTABLE: ${{ github.workspace }}/.engine-source/target/debug/quant-backtest-engine
        run: uv run --locked pytest -q tests/test_engine_validation.py tests/test_rust_engine_jobs.py tests/test_engine_sessions.py
