name: runtime-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install locked documentation dependencies
        run: uv sync --locked --group docs --python 3.13
      - name: Build documentation and check localized navigation
        run: |
          uv run --locked --group docs mkdocs build --strict
          uv run --locked --group docs python project_tools/check_locale_navigation.py
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - name: Go formatting, analysis and race tests
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race ./...
      - name: Check reachable Go dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build Go CLI outside the source tree
        run: go build -race -ldflags "-X github.com/runchengxie/quant-backtest-runtime/internal/app.SourceRevision=$GITHUB_SHA" -o "$RUNNER_TEMP/backtest-job" ./cmd/backtest-job

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install locked dependencies
        run: uv sync --locked --extra legacy --group dev --python ${{ matrix.python }}
      - name: Lint
        run: uv run --locked --extra legacy ruff check src scripts tests
      - name: Format
        run: uv run --locked --extra legacy ruff format --check src scripts tests
      - name: Type check
        run: uv run --locked --extra legacy ty check src scripts
      - name: Backtest worker and release tests
        run: |
          uv run --locked --extra legacy coverage run -m pytest -q
          uv run --locked --extra legacy coverage combine
          uv run --locked --extra legacy coverage report
      - name: Synthetic CLI workflow
        run: uv run --locked --extra legacy python scripts/smoke_backtest.py
      - name: Dependency audit
        if: matrix.python == '3.13'
        run: uv run --locked --extra legacy pip-audit --local
      - name: Documentation build
        run: uv run --locked --extra legacy --group docs mkdocs build --strict

  rust-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: runchengxie/quant-backtest-engine
          ref: c65548a4ee1e938125cce1edbcc282c760c4c8f2
          path: .engine-source
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .engine-source
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: cargo build --locked --manifest-path .engine-source/Cargo.toml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - name: Build Go CLI outside the source tree
        run: go build -race -ldflags "-X github.com/runchengxie/quant-backtest-runtime/internal/app.SourceRevision=$GITHUB_SHA" -o "$RUNNER_TEMP/backtest-job" ./cmd/backtest-job
      - run: uv sync --locked --extra legacy --group dev --python 3.13
      - name: Go protocol checks against the real engine
        env:
          BACKTEST_ENGINE_TEST_EXECUTABLE: ${{ github.workspace }}/.engine-source/target/debug/quant-backtest-engine
        run: go test -race ./internal/protocol
      - name: Go lifecycle and legacy adapter integration
        env:
          BACKTEST_GO_EXECUTABLE: ${{ runner.temp }}/backtest-job
          BACKTEST_EXPECTED_RUNTIME_REVISION: ${{ github.sha }}
          BACKTEST_ENGINE_TEST_EXECUTABLE: ${{ github.workspace }}/.engine-source/target/debug/quant-backtest-engine
        run: uv run --locked --extra legacy pytest -q tests/test_go_runtime.py tests/test_native_smoke.py
      - name: Delegated per-job memory, cancellation and restart checks
        run: |
          go test -c -o "$RUNNER_TEMP/jobgroup.test" ./internal/jobgroup
          go test -c -o "$RUNNER_TEMP/app.test" ./internal/app
          sudo systemd-run --wait --pipe --collect --unit="runtime-group-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -p Delegate=memory -p DelegateSubgroup=supervisor /usr/bin/env JOBGROUP_INTEGRATION=1 "$RUNNER_TEMP/jobgroup.test" -test.run TestDelegatedLifecycle -test.v
          sudo systemd-run --wait --pipe --collect --unit="runtime-receipt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -p Delegate=memory -p DelegateSubgroup=supervisor /usr/bin/env JOBGROUP_INTEGRATION=1 "$RUNNER_TEMP/app.test" -test.run TestResourceReceiptPrecedesGroupRemoval -test.v
          sudo systemd-run --wait --pipe --collect --unit="runtime-memory-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -p Delegate=memory -p DelegateSubgroup=supervisor --working-directory="$GITHUB_WORKSPACE" /usr/bin/env GORACE=atexit_sleep_ms=0 BACKTEST_CGROUP_ROOT=auto BACKTEST_GO_EXECUTABLE="$RUNNER_TEMP/backtest-job" BACKTEST_ENGINE_TEST_EXECUTABLE="$GITHUB_WORKSPACE/.engine-source/target/debug/quant-backtest-engine" "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q tests/test_go_cgroups.py
      - name: Real Rust engine job and lifecycle checks
        env:
          BACKTEST_ENGINE_TEST_EXECUTABLE: ${{ github.workspace }}/.engine-source/target/debug/quant-backtest-engine
        run: uv run --locked --extra legacy pytest -q tests/test_engine_validation.py tests/test_rust_engine_jobs.py tests/test_engine_sessions.py

  session-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: runchengxie/quant-backtest-engine
          ref: c65548a4ee1e938125cce1edbcc282c760c4c8f2
          path: .stream-engine-source
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .stream-engine-source -> ${{ runner.temp }}/session-engine-target
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build the separately pinned session-stream provider
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/session-engine-target
        run: cargo build --locked --manifest-path .stream-engine-source/Cargo.toml
      - run: uv sync --locked --extra legacy --group dev --python 3.13
      - name: Real session channel, strict framing and journal replay checks
        env:
          BACKTEST_ENGINE_STREAM_TEST_EXECUTABLE: ${{ runner.temp }}/session-engine-target/debug/quant-backtest-engine
        run: |
          test -x "$BACKTEST_ENGINE_STREAM_TEST_EXECUTABLE"
          uv run --locked --extra legacy pytest -q tests/test_session_stream.py tests/test_session_stream_process.py

  minimal-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: runchengxie/quant-backtest-engine
          ref: c65548a4ee1e938125cce1edbcc282c760c4c8f2
          path: .engine-source
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: .engine-source
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: cargo build --locked --manifest-path .engine-source/Cargo.toml
      - name: Build and install minimal wheel without optional dependencies
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/runtime-wheel"
          uv venv --python 3.13 "$RUNNER_TEMP/runtime-core"
          uv pip install --python "$RUNNER_TEMP/runtime-core/bin/python" --no-deps "$RUNNER_TEMP"/runtime-wheel/*.whl
      - name: Minimal wheel discovery, read-only preflight and real v6 publication
        run: |
          "$RUNNER_TEMP/runtime-core/bin/python" scripts/smoke_core.py --engine-executable "$GITHUB_WORKSPACE/.engine-source/target/debug/quant-backtest-engine"
