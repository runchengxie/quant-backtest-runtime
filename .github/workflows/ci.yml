name: runtime-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python }}
      - name: Lint
        run: uv run --locked ruff check src scripts tests
      - name: Format
        run: uv run --locked ruff format --check src scripts tests
      - name: Type check
        run: uv run --locked ty check src scripts
      - name: Backtest worker and release tests
        run: |
          uv run --locked coverage run -m pytest -q
          uv run --locked coverage combine
          uv run --locked coverage report
      - name: Synthetic CLI workflow
        run: uv run --locked python scripts/smoke_backtest.py
      - name: Dependency audit
        if: matrix.python == '3.13'
        run: uv run --locked pip-audit --local
