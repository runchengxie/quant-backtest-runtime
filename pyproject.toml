[build-system]
requires = ["setuptools>=84", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-backtest-runtime"
version = "0.1.0"
description = "Independent durable backtest job runtime"
requires-python = ">=3.12"
dependencies = ["quant-platform>=0.0.1"]

[project.scripts]
backtest-job = "backtest_runtime.cli:main"
backtest-worker = "backtest_runtime.worker:main"

[dependency-groups]
dev = [
    "coverage>=7.10",
    "pip-audit>=2.10.1",
    "pytest>=9",
    "ruff>=0.8",
    "ty>=0.0.84",
]

[tool.uv.sources]
quant-platform = { git = "https://github.com/runchengxie/quant-platform.git", rev = "59c432baf5395f8fdd8cffe2dd7d02276c2526ae" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C90", "RUF", "BLE"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
source = ["backtest_runtime"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 75

[tool.ty.environment]
python-version = "3.12"
