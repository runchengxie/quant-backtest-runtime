site_name: quant-backtest-runtime
site_description: 回测任务运行时的使用、开发与运维文档
site_url: https://runchengxie.github.io/quant-backtest-runtime/
repo_name: runchengxie/quant-backtest-runtime
repo_url: https://github.com/runchengxie/quant-backtest-runtime
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - 概览: index.md
  - 回测任务与结果: jobs.md
  - 开发与检查: development.md
  - 发布与故障排查: operations.md
  - 仓库职责: ownership.md
