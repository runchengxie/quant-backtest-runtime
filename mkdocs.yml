site_name: quant-backtest-runtime
site_description: Backtest job runtime usage, development, and operations documentation
site_url: https://runchengxie.github.io/quant-backtest-runtime/
repo_name: runchengxie/quant-backtest-runtime
repo_url: https://github.com/runchengxie/quant-backtest-runtime
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.instant
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

hooks:
  - project_tools/locale_navigation.py

nav:
  - English:
      - Overview: index.md
      - Backtest jobs and results: jobs.md
      - Development and checks: development.md
      - Operations and troubleshooting: operations.md
      - Repository ownership: ownership.md
  - 简体中文:
      - 首页: index.zh-CN.md
      - 回测任务与结果: jobs.zh-CN.md
      - 开发与检查: development.zh-CN.md
      - 发布与故障排查: operations.zh-CN.md
      - 仓库职责与迁移: ownership.zh-CN.md
