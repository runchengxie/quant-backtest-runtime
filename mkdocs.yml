site_name: quant-backtest-runtime
site_description: 回测任务运行时的使用、开发与运维文档
site_url: https://runchengxie.github.io/quant-backtest-runtime/
repo_name: runchengxie/quant-backtest-runtime
repo_url: https://github.com/runchengxie/quant-backtest-runtime
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.instant
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - 概览: index.md
  - 回测任务与结果: jobs.md
  - 开发与检查: development.md
  - 发布与故障排查: operations.md
  - 仓库职责: ownership.md
